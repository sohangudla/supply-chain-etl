[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-etl"
version = "1.0.0"
description = "Supply-chain order ETL pipeline: Olist CSVs -> PostgreSQL star schema"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs a running PostgreSQL (olist_test database)"]
